<p-card [header]="header()">
    <div class="flex flex-col gap-20">
        <div class="flex flex-row flex-wrap gap-5">
            <p-button label="Load Next Batch" [badge]="primaryDataset().loadingProgressLabel()" [disabled]="isLoading()" (onClick)="primaryDataset().loadNextBatch(requestValue())" />
            @if (isCompareMode()) {
                <p-button label="Load Next Compare Batch" [badge]="compareDataset().loadingProgressLabel()" [disabled]="isLoading()" (onClick)="compareDataset().loadNextBatch(requestCompare())" />
            }
            <p-button label="Load All" [disabled]="isLoading()" (onClick)="loadAllData()" />
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-10">
            @if (isLoading()) {
                <p-skeleton height="21rem" />
                <p-skeleton height="21rem" />
                <p-skeleton height="21rem" />
                <p-skeleton height="21rem" />
            } @else {
                <intersection-histogram-chart 
                    [data]="primaryFilteredData()" 
                    [(selectedMetric)]="propertyChart" 
                    [label]="label()" 
                    [config]="config()"
                    [chartFilter]="chartFilter()"/>
                @if (!isCompareMode()) {
                    <intersection-boxplot-chart 
                        [data]="primaryFilteredData()" 
                        [(selectedMetric)]="propertyChart"  
                        [label]="label()" 
                        [config]="config()"
                        [chartFilter]="chartFilter()"/>
                    @if (showScatter()) {
                        <intersection-scatter-plot-start-time
                            [data]="primaryFilteredData()" 
                            [(selectedMetric)]="propertyChart"  
                            [label]="label()" 
                            [config]="config()"
                            [chartFilter]="chartFilter()"/>
                    } @else {
                        <intersection-heatmap-start-time-chart
                            [data]="primaryFilteredData()" 
                            [(selectedMetric)]="propertyChart"  
                            [label]="label()" 
                            [config]="config()"
                            [chartFilter]="chartFilter()"/>
                    }
                }
                @if (showScatter()) {
                    <intersection-scatter-plot
                        [data]="primaryFilteredData()" 
                        [(selectedMetric)]="propertyChart"  
                        [label]="label()"
                        [config]="config()"
                        [chartFilter]="chartFilter()"/>
                } @else {
                    <intersection-heatmap-chart
                        [data]="primaryFilteredData()" 
                        [(selectedMetric)]="propertyChart"  
                        [label]="label()"
                        [config]="config()"
                        [chartFilter]="chartFilter()"/>
                }
                @let cConfig = compareConfig();
                @if (cConfig) {
                    <intersection-histogram-chart 
                        [data]="mergedCompareData()" 
                        [(selectedMetric)]="compareProperty" 
                        [label]="compareLabel()" 
                        [config]="cConfig"
                        [chartFilter]="$any(chartFilter())"/>
                    <intersection-heatmap-chart
                        [data]="mergedCompareData()" 
                        [(selectedMetric)]="compareProperty" 
                        [label]="compareLabel()" 
                        [config]="cConfig"
                        [chartFilter]="$any(chartFilter())"/>
                }
            }
        </div>
    </div>
</p-card>
