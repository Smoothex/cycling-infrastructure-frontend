<div>
	<p-card>
		<p-table
            [value]="$any(rows())"
            [paginator]="true"
            [loading]="loading()"
            [lazy]="true"
            [rows]="activeFilter().size"
            [rowsPerPageOptions]="[10, 20, 50]"
            [totalRecords]="totalElements()"
			(onFilter)="onFilterChange($event)"
			(onLazyLoad)="onLazy($event)"
            [resetPageOnSort]="true"
            [sortField]="'avgWaitingTime'"
            [sortOrder]="-1"
        >
            <ng-template pTemplate="caption" class="pt-0">
				<div class="flex flex-row justify-evenly items-center">
                    <p-togglebutton class="w-1/3" [(ngModel)]="isNode" (onChange)="updateData()" offLabel="Wege" onLabel="Kreuzungen" />
                    <intersection-region-tree
                        class="w-1/3"
                        [preselectedRegionLTreePath]="initialValues.regionLTreePath"
                        [requireSelection]="true"
                        (selectedRegionLTreePath)="onRegionChange($event)"
                    />
                </div>
			</ng-template>
            <ng-template pTemplate="header">
                <tr intersection-list-header
                    [columns]="columns()"
                ></tr>
                <tr intersection-list-header-filter
                    [columns]="columns()"
                    (filterChange)="onFilterChange($event)">
				</tr>
            </ng-template>

            <ng-template pTemplate="body" let-rowData>
                <tr intersection-list-content 
                    [row]="rowData" 
                    [columns]="columns()">
                </tr>
            </ng-template>
		</p-table>
	</p-card>
</div>
