<intersection-settings-drawer
        [(visible)]="sidebarVisible"
        [settings]="settings()"
		[(fullscreenMode)]="fullscreenMode"
		[(screenshotMode)]="screenshotMode"
    >
	
	@if (extendedSettings()) {
		<ng-container more-content>
			<p-divider />
			<div class="flex flex-col">
				<label class="font-bold text-xs" for="rideSelection">Select Ride ID</label>
				@if (sidebarVisible()) {
				<p-list-box 
					[options]="selectableRideIds()"
					[(ngModel)]="selectedRideId"
					optionLabel="label"
					optionValue="id"
					
					[filter]="true"
					filterBy="id"
					(onFilter)="filterRides($event)"
					
					[virtualScroll]="true" 
					[virtualScrollItemSize]="38"
					scrollHeight="250px"

					[lazy]="true"
					(onLazyLoad)="updatePage($event)"
					size="small"
					inputId="rideSelection"
					appendTo="self"
				/>
				}
			</div>
		</ng-container>
	}
</intersection-settings-drawer>

<p-popover #popoverInfo >
	<div>
		Info about map. TODO: Write info text.
	</div>
	<p>
		Text about inaccuracy of GPS mapping.
	</p>
</p-popover>
<div class="map-settings" [hidden]="screenshotMode()">
	<p-card>
		<div class="flex flex-row gap-2">
			<p-button 
				icon="pi pi-cog"
				size="small"
				severity="secondary"
				[rounded]="true"
				[outlined]="true"
				(click)="sidebarVisible.set(!sidebarVisible())"
			></p-button>
			<p-button 
				icon="pi pi-question"
				size="small"
				severity="secondary"
				[rounded]="true"
				[outlined]="true"
				(click)="popoverInfo.toggle($event)"
			></p-button>
		</div>
	</p-card>
</div>
